tcrlm_tcr_construction:
  input_topic: "/carla/sensor_mount/lidar/merged"
  output_topic: "/tcrlm/preprocess/cloud_tcr"
  publish_labeled_mask: true
  labeled_mask_topic: "/tcrlm/preprocess/cloud_filter_mask"
  input_queue_size: 100
  drop_nan: true
  log_timing: false
  height_axis: "-x"
  output_rotation_roll_deg: 0.0
  output_rotation_pitch_deg: -90.0
  output_rotation_yaw_deg: 0.0
  output_frame_id: "velodyne"
  intensity_threshold: 0.0
  cloth_resolution_m: 1.0
  time_step: 0.1
  rigidness: 1
  steep_slope_fit: false
  classification_threshold_m: 0.5
  postprocess_height_threshold_m: 0.3
  cloth_buffer_m: 2.0
  max_iterations: 500
  convergence_eps_m: 0.01
  nonground_dilation_m: 0.5
  nonground_dilation_mode: "bev_candidate_voxel_3d"
  nonground_seed_grid_resolution_m: 0.5
  nonground_dilation_min_seed_points: 50
  nonground_dilation_min_seed_cells: 10
  candidate_voxel_resolution_m: 0.5
  export_labeled_txt: false
  export_labeled_txt_dir: "/tmp/tcrlm_tcr_labels"
