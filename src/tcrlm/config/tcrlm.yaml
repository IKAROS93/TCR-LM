tcrlm:
  pointCloudTopic: "/tcrlm/preprocess/cloud_tcr"
  imuTopic: "/carla/sensor_mount/imu"
  odomTopic: "odometry/imu"
  imuInitialGuessTopic: ""
  gpsTopic: "odometry/gps"
  gnssHeadingTopic: ""
  lidarFrame: "velodyne"
  baselinkFrame: "base_link"
  odometryFrame: "odom"
  mapFrame: "map"

  sensor: "velodyne"
  N_SCAN: 128
  Horizon_SCAN: 1800
  downsampleRate: 1
  lidarMinRange: 1.0
  lidarMaxRange: 1000.0
  projectionColumnMode: "time"
  projectionTimeScanPeriod: 0.1
  extrinsicTrans: [0.0, 0.0, 0.0]
  extrinsicRot: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  extrinsicRPY: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  imuGyrScale: [1.0, 1.0, 1.0]

  useImu: false
  useImuOrientation: true
  useImuDeskew: false
  useLidarOdomDeskew: true
  useImuRPYInFrontend: false
  useImuInitialGuess: true
  useImuHeadingInitialization: false
  useGpsElevation: false
  enableGpsFactor: false
  gpsCovThreshold: 1000.0
  poseCovThreshold: 0.0
  waitForGnssInitialization: false
  enableGnssHeadingFactor: false
  enableFeatureCloudLeveling: false
  imuAccNoise: 0.10
  imuGyrNoise: 0.01
  imuAccBiasN: 0.001
  imuGyrBiasN: 0.0005
  imuGravity: 9.80511
  imuRPYWeight: 0.005
  imuInitialGuessWeight: 0.08
  useImuPosePrior: true
  useImuPosePriorInLM: true
  useImuPosePriorInGraph: false
  useImuPosePriorPosition: false
  useImuPosePriorRollPitch: true
  useImuPosePriorYaw: true
  imuPosePriorMaxAge: 0.20
  imuPosePriorPositionSigma: 5.0
  imuPosePriorRollPitchSigma: 0.6
  imuPosePriorYawSigma: 1.5
  imuPosePriorLmScale: 0.08
  imuPosePriorGraphScale: 1.0
  edgeThreshold: 0.5
  surfThreshold: 0.05
  scanRingSegments: 6
  maxEdgePerSegment: 20
  linePlaneFittingKnn: 5
  edgeFeatureMinValidNum: 10
  surfFeatureMinValidNum: 50
  featureCloudInfoQueueSize: 200
  mappingCloudInfoQueueSize: 200
  usePreprocessFilterMask: true
  preprocessFilterMaskTopic: "/tcrlm/preprocess/cloud_filter_mask"
  preprocessFilterMaskSyncTolerance: 0.12
  featurePostProcessEnable: true
  featurePostProcessWindowCols: 10
  featurePostProcessWindowRings: 4
  featurePostProcessTrendCols: 12
  featurePostProcessMinValidPerSide: 4
  featurePostProcessMissingRunThreshold: 3
  featurePostProcessScanEdgeMargin: 20
  featurePostProcessNearRangeThreshold: 15.0
  featurePostProcessDensityBeforeCols: 4
  featurePostProcessZeroDensityCols: 8
  featurePostProcessGapDensityThreshold: 0.65
  featurePostProcessValidDensityThreshold: 0.60
  featurePostProcessZeroDensityThreshold: 0.60
  featurePostProcessSameRingLabel1Cols: 12
  featurePostProcessCrossRingCols: 8
  featurePostProcessRangeJumpAbs: 0.8
  featurePostProcessRangeJumpRel: 0.08
  featurePostProcessSpacingJumpRatio: 2.0
  featurePostProcessVerticalSupportColRadius: 2
  featurePostProcessMaskNeighborCols: 2
  featurePostProcessMaskNeighborRings: 1
  featurePostProcessMaskBoundaryCols: 2
  featurePostProcessMaskBoundaryRings: 1
  featurePostProcessInvalidSeedDensityThreshold: 0.05
  featurePostProcessMaskInvalidSeeds: true
  featurePostProcessColumnNmsEnable: false
  bevBalancedEdgeEnable: true
  bevBalancedEdgeGridSize: 2.0
  bevBalancedEdgeMaxPerCell: 4
  bevBalancedEdgeMaxTotal: 0
  bevBalancedEdgeMinRange: 0.0

  odometrySurfLeafSize: 0.5
  mappingCornerLeafSize: 0.1
  mappingSurfLeafSize: 0.2
  terrainChangeInputLeafSize: 0.2
  z_tollerance: 1000.0
  rotation_tollerance: 1000.0
  numberOfCores: 8
  mappingProcessInterval: 0.1
  surroundingkeyframeAddingDistThreshold: 0.1
  surroundingkeyframeAddingAngleThreshold: 0.2
  surroundingKeyframeDensity: 1.0
  surroundingKeyframeSearchRadius: 50.0
  enableReverseMotionGuard: false
  enableTerrainChangeMaintenance: true
  terrainChangeWriteBackLabels: true
  terrainChangeApplyToMapping: true
  terrainChangeMappingMode: "downweight"
  terrainChangeHeightAxis: "-z"
  terrainChangeGridResolution: 1.0
  terrainChangeDetectionInterval: 1.0
  terrainChangeMinActiveKeyframes: 5
  terrainChangeMinCellPoints: 4
  terrainChangeMinLayerPoints: 5
  terrainChangeLayerBand: 0.15
  terrainChangeMinLayerTimeSeparation: 3.0
  terrainChangeTauUp: 0.25
  terrainChangeTauDown: 0.25
  terrainChangeWriteBand: 0.15
  terrainChangeRecentBand: 0.25
  terrainChangeMinRegionCells: 10
  terrainChangeMinRegionArea: 10.0
  terrainChangeRequiredConfirmations: 1
  terrainChangeWeightDropPerConfirmation: 0.1
  terrainChangeMinFeatureWeight: 0.1
  terrainChangeMaxUpdateRatioPerKeyframe: 1.0
  terrainChangeMaxFeatureUpdateRatioPerKeyframe: 1.0
  terrainChangeMaxVisualizationKeyframes: 300
  terrainChangePublishCandidateClouds: true
  terrainChangeLogSummary: true

  savePCD: false
  savePCDDirectory: "/tmp/tcrlm_map/"
  exportKeyframeDatasetOnSave: false
  loopClosureEnableFlag: false
  globalMapVisualizationSearchRadius: 1000.0
  globalMapVisualizationPoseDensity: 2.0
  globalMapVisualizationLeafSize: 0.3
